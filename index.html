<title>نمونه سوالات امیر | بانک نمونه سوالات</title>

<style>

    margin-left: 7px;

    background: #e5f8ed;

<body>

<header>
    <h1>📚 نمونه سوالات امیر</h1>
    <p>بانک نمونه سوالات پایه‌های هفتم، هشتم و نهم</p>
    <p>آزمون آنلاین و پاسخ‌های تشریحی</p>
</header>

<main>

<div class="card">
    <h2>انتخاب پایه و درس</h2>

    <label for="grade">پایه تحصیلی:</label>
    <select id="grade">
        <option value="7">پایه هفتم</option>
        <option value="8">پایه هشتم</option>
        <option value="9">پایه نهم</option>
    </select>

    <label for="subject">درس:</label>
    <select id="subject">
        <option value="math">ریاضی</option>
        <option value="science">علوم</option>
        <option value="social">مطالعات اجتماعی</option>
        <option value="persian">فارسی</option>
    </select>

    <button onclick="practice()">📖 نمایش سوال و جواب تشریحی</button>
    <button onclick="start()">🎯 شروع آزمون آنلاین</button>
</div>

<div class="card">
    <h2 id="title">سوالات</h2>
    <div id="questions">پایه و درس را انتخاب کن.</div>
    <div id="result"></div>
    <button id="submit" style="display:none" onclick="check()">
        محاسبه نمره از ۲۰
    </button>
</div>

</main>

<footer>
    ساخته‌شده با ❤️ برای دانش‌آموزان
    <br>
    نمونه سوالات امیر
</footer>

<script>
const data = {
    math: [
        ["حاصل ۵+۳×۲ چیست؟", ["۱۶","۱۱","۱۳","۱۰"], 1,
        "ابتدا ضرب می‌کنیم: ۳×۲=۶ و سپس ۵ را اضافه می‌کنیم."],

        ["محیط مربع با ضلع ۴ چیست؟", ["۸","۱۲","۱۶","۲۰"], 2,
        "محیط مربع برابر چهار برابر ضلع است."],

        ["جذر ۶۴ چند است؟", ["۶","۷","۸","۹"], 2,
        "۸ ضربدر ۸ برابر ۶۴ است."],

        ["اگر x+۳=۱۰ باشد، x چند است؟", ["۵","۶","۷","۱۳"], 2,
        "۱۰ منهای ۳ برابر ۷ است."],

        ["مجموع زاویه‌های مثلث چند درجه است؟", ["۹۰","۱۸۰","۲۷۰","۳۶۰"], 1,
        "مجموع زاویه‌های داخلی مثلث ۱۸۰ درجه است."]
    ],

    science: [
        ["واحد سازنده مواد چیست؟", ["سلول","اتم","بافت","اندام"], 1,
        "اتم یکی از واحدهای بنیادی سازنده مواد است."],

        ["کدام تغییر فیزیکی است؟", ["سوختن کاغذ","زنگ زدن آهن","ذوب شدن یخ","پختن تخم‌مرغ"], 2,
        "در ذوب یخ، ماده از حالت جامد به مایع تبدیل می‌شود."],

        ["کدام اندام خون را به گردش درمی‌آورد؟", ["معده","قلب","ریه","کلیه"], 1,
        "قلب خون را در رگ‌ها به جریان می‌اندازد."],

        ["کدام فلز رسانای برق است؟", ["مس","چوب","پلاستیک","لاستیک"], 0,
        "مس رسانای خوب برق است."],

        ["دما با چه وسیله‌ای اندازه‌گیری می‌شود؟", ["ترازو","دماسنج","خط‌کش","ساعت"], 1,
        "دماسنج برای اندازه‌گیری دماست."]
    ],

    social: [
        ["جهت مقابل شمال کدام است؟", ["شرق","غرب","جنوب","شمال‌شرق"], 2,
        "جنوب مقابل شمال است."],

        ["نقشه چه کاربردی دارد؟", ["نمایش مکان‌ها","اندازه‌گیری وزن","اندازه‌گیری دما","اندازه‌گیری زمان"], 0,
        "نقشه مکان‌ها و ویژگی‌های سطح زمین را نمایش می‌دهد."],

        ["کدام منبع طبیعی است؟", ["پلاستیک","نفت","دفتر","میز"], 1,
        "نفت یکی از منابع طبیعی است."],

        ["چرا باید در مصرف آب صرفه‌جویی کنیم؟", ["آب شیرین محدود است","آب کاربرد ندارد","باران نمی‌بارد","آب همیشه آلوده است"], 0,
        "آب شیرین قابل استفاده محدود است."],

        ["کدام رفتار نمونه همکاری است؟", ["کمک به هم‌کلاسی","تخریب وسایل","بی‌توجهی","رعایت نکردن نوبت"], 0,
        "کمک به دیگران نمونه‌ای از همکاری است."]
    ],

    persian: [
        ["کدام کلمه اسم است؟", ["زیبا","رفت","دانش‌آموز","آرام"], 2,
        "دانش‌آموز نام یک شخص است."],

        ["مخالف روشن چیست؟", ["نورانی","تاریک","سفید","درخشان"], 1,
        "تاریک مخالف روشن است."],

        ["کدام جمله پرسشی است؟", ["هوا خوب است.","کتاب را باز کن.","آیا آمدی؟","چه روز زیبایی!"], 2,
        "جمله پرسشی برای پرسیدن به کار می‌رود."],

        ["کدام واژه صفت است؟", ["مدرسه","دوید","مهربان","دفتر"], 2,
        "مهربان ویژگی شخص را بیان می‌کند."],

        ["مترادف شاد چیست؟", ["غمگین","خوشحال","خسته","ناراحت"], 1,
        "شاد و خوشحال هم‌معنی هستند."]
    ]
};

const grade8 = [
    ["حاصل ۳ به توان ۲ چیست؟", ["۶","۹","۸","۱۲"], 1,
    "۳×۳ برابر ۹ است."],

    ["اگر x+۵=۱۲ باشد، x چند است؟", ["۵","۶","۷","۱۷"], 2,
    "۱۲ منهای ۵ برابر ۷ است."],

    ["مجموع زاویه‌های مثلث چند است؟", ["۹۰","۱۸۰","۲۷۰","۳۶۰"], 1,
    "مجموع زاویه‌های مثلث ۱۸۰ درجه است."],

    ["جذر ۸۱ چیست؟", ["۷","۸","۹","۱۰"], 2,
    "۹×۹ برابر ۸۱ است."],

    ["کدام عدد بر ۳ بخش‌پذیر است؟", ["۱۲۴","۱۲۵","۱۲۶","۱۲۸"], 2,
    "مجموع رقم‌های ۱۲۶ برابر ۹ است."]
];

const grade9 = [
    ["اگر ۲x=۱۸ باشد، x چند است؟", ["۶","۸","۹","۱۲"], 2,
    "۱۸ تقسیم بر ۲ برابر ۹ است."],

    ["حاصل (x+۳)(x+۲) چیست؟", ["x²+۵x+۶","x²+۶","x²+x+۵","۲x+۵"], 0,
    "با ضرب عبارت‌ها، x²+۵x+۶ به دست می‌آید."],

    ["وتر کدام ضلع است؟", ["مقابل زاویه قائمه","کوتاه‌ترین ضلع","هر ضلع","ضلع دلخواه"], 0,
    "وتر روبه‌روی زاویه ۹۰ درجه قرار دارد."],

    ["شیب خط y=۳x+۲ چیست؟", ["۲","۳","۵","۱"], 1,
    "ضریب x شیب خط است."],

    ["احتمال آمدن عدد زوج در تاس چیست؟", ["۱/۶","۲/۶","۳/۶","۶/۶"], 2,
    "سه عدد از شش عدد تاس زوج‌اند."]
];

let items = [];
let mode = "practice";

function getItems() {
    const g = document.getElementById("grade").value;
    const s = document.getElementById("subject").value;

    if (s === "math" && g === "8") {
        return grade8;
    }

    if (s === "math" && g === "9") {
        return grade9;
    }

    return data[s];
}

function render(showAnswers) {
    const root = document.getElementById("questions");
    root.replaceChildren();

    items.forEach((q, i) => {
        const d = document.createElement("div");
        d.className = "question";

        const h = document.createElement("h3");
        h.textContent = (i + 1) + ". " + q[0];
        d.appendChild(h);

        q[1].forEach((option, j) => {
            const label = document.createElement("label");
            label.className = "option";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "q" + i;
            radio.value = j;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(option));
            d.appendChild(label);
        });

        if (showAnswers) {
            const answer = document.createElement("div");
            answer.className = "answer";
            answer.textContent =
                "پاسخ درست: " + q[1][q[2]] + " — " + q[3];
            d.appendChild(answer);
        }

        root.appendChild(d);
    });
}

function practice() {
    mode = "practice";
    items = getItems();
    render(true);

    document.getElementById("title").textContent =
        "📖 سوال‌ها و پاسخ‌های تشریحی";

    document.getElementById("submit").style.display = "none";
    document.getElementById("result").textContent = "";
}

function start() {
    mode = "quiz";
    items = getItems();
    render(false);

    document.getElementById("title").textContent = "🎯 آزمون آنلاین";
    document.getElementById("submit").style.display = "block";
    document.getElementById("result").textContent = "";
}

function check() {
    let correct = 0;

    items.forEach((q, i) => {
        const selected = document.querySelector(
            'input[name="q' + i + '"]:checked'
        );

        if (selected && Number(selected.value) === q[2]) {
            correct++;
        }
    });

    const score = correct * 4;

    document.getElementById("result").textContent =
        "نمره شما: " + score + " از ۲۰ (" +
        correct + " پاسخ درست از " + items.length + ")";
}
</script>

</body>
</html>
