}

function render(showAnswers) {
  const root = document.getElementById("questions");
  root.innerHTML = "";

  items.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "question";

    const h = document.createElement("h3");
    h.textContent = (i + 1) + ". " + q[0];
    d.appendChild(h);

    q[1].forEach((option, j) => {
      const label = document.createElement("label");
      label.className = "option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "q" + i;
      radio.value = j;

      label.appendChild(radio);
      label.appendChild(document.createTextNode(" " + option));
      d.appendChild(label);
    });

    if (showAnswers) {
      const answer = document.createElement("div");
      answer.className = "answer";
      answer.textContent = "پاسخ درست: " + q[1][q[2]] + " — " + q[3];

    }

    root.appendChild(d);
  });

  mode = "practice";

function start() {
  mode = "quiz";

  document.getElementById("result").textContent = "";
}

  items.forEach((q, i) => {
    const selected = document.querySelector('input[name="q' + i + '"]:checked');
    if (selected && Number(selected.value) === q[2]) {
      correct++;
    }
  });

  const score = correct * 4;
  document.getElementById("result").textContent =
    "نمره شما: " + score + " از ۲۰ — " +
    correct + " پاسخ درست از " + items.length;

  document.getElementById("retry").style.display = "block";
